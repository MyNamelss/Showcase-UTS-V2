<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showcase UTS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 24px;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
    }
    main {
      width: 100%; max-width: 620px; padding: 36px;
      border: 1px solid #ffffff30; border-radius: 20px;
      background: #ffffff12;
    }
    h1 { font-size: 2.4rem; margin-bottom: 12px; }
    p { line-height: 1.7; color: #dbeafe; }
    .status {
      display: inline-block; padding: 8px 12px;
      border-radius: 30px; background: #dcfce7;
      color: #166534; font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <span class="status">● Website Aktif</span>
    <h1>Showcase UTS</h1>
    <p>Selamat datang di Showcase UTS.</p>
    <p>Halaman showcase sedang tersedia. Layanan backend dan database sedang dalam pemeliharaan.</p>
  </main>
</body>
</html>
